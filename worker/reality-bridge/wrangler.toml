## 现实桥 Cloudflare Worker — wrangler 配置
##
## 作用：iPhone 快捷指令 POST 数据 → 云收件箱 → 按角色开关+autoReply 生成角色回应
## → Web Push 下发；App 被杀也能收（Worker 内解密用户上传的加密 LLM 凭据并跑模型）。

name = "reality-bridge"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[observability.logs]
enabled = true

## 部署前把 database_id 换成 `wrangler d1 create reality-bridge-db` 输出的真实 id，
## 并执行一次 `wrangler d1 execute reality-bridge-db --file=./schema.sql`。
[[d1_databases]]
binding = "DB"
database_name = "reality-bridge-db"
database_id = "bbba106d-56c1-4f85-9da8-fbfd24a279fe"

## 非 secret 变量：
[vars]
VAPID_SUBJECT = "mailto:replace-with-your-email@example.com"

## secret（用 wrangler secret put / Deploy to Cloudflare 按钮的输入框填）：
##   VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY —— 前端 pushVapid 生成的同一对
##   MASTER_KEY                            —— 加密 LLM 凭据用（64 位 hex，openssl rand -hex 32）
##   CLIENT_TOKEN（可选，配了则请求需带 Authorization: Bearer <token>）
